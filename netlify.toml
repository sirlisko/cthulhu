[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/personaggi/agatha"
  to = "/personaggi/agatha-fletcher"
  status = 301

[[redirects]]
  from = "/png/kurt"
  to = "/png/kurt-vebert"
  status = 301

# Cronologia was merged into Capitoli.
[[redirects]]
  from = "/cronologia"
  to = "/diario/"
  status = 301
